
<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nothing 耳機介紹網站</title>

<style type="text/css">

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #fff;
    font-family: Verdana, "Noto Sans TC", sans-serif;
}

/* Main menu settings */

#centeredmenu {
    clear: both;
    float: left;
    margin: 0;
    padding: 0;
    border-bottom: 2px solid #000;
    width: 100%;
    font-family: Verdana, Geneva, sans-serif;
    font-size: 90%;
    z-index: 1000;
}

/* Top menu items */

#centeredmenu ul {
    margin: 0;
    padding: 0;
    list-style: none;
    float: right;
    position: relative;
    right: 50%;
}

#centeredmenu ul li {
    margin: 0 0 0 1px;
    padding: 0;
    float: left;
    position: relative;
    left: 50%;
    top: 1px;
}

#centeredmenu ul li a {
    display: block;
    margin: 0;
    padding: .8em 1em .6em;
    font-size: 1em;
    line-height: 1em;
    background: #ddd;
    text-decoration: none;
    color: #444;
    font-weight: bold;
    border-bottom: 1px solid #000;
}

#centeredmenu ul li.active a {
    color: #fff;
    background: #000;
}

#centeredmenu ul li a:hover {
    background: #000;
    color: #fff;
    border-bottom: 1px solid #000;
}

/* Submenu items */

#centeredmenu ul ul {
    display: none;
    position: absolute;
    top: 2.5em;
    left: 0;
    right: auto;
    width: 12em;
    z-index: 1001;
}

#centeredmenu ul ul li {
    left: auto;
    margin: 0;
    clear: left;
    width: 100%;
}

#centeredmenu ul ul li a,
#centeredmenu ul li.active li a,
#centeredmenu ul li:hover ul li a {
    font-size: .85em;
    font-weight: normal;
    background: #eee;
    color: #444;
    line-height: 1.5em;
    border-bottom: 1px solid #ddd;
}

#centeredmenu ul ul li a:hover {
    background: #000;
    color: #fff;
}

/* Show submenu on hover */

#centeredmenu ul li:hover ul {
    display: block;
}

/* iframe settings */

iframe {
    display: block;
    margin: 30px auto;
    width: 90%;
    max-width: 1100px;
    height: 650px;
    border: 1px solid #ddd;
}

</style>
</head>

        </li>

    </ul>
</div>
